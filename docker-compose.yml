services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: surgam
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/surgam
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      REDIS_HOST: redis
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET:?Set JWT_HMAC_SECRET}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?Set OTP_HMAC_SECRET}
      PAN_HMAC_SECRET: ${PAN_HMAC_SECRET:?Set PAN_HMAC_SECRET}
      PAN_ENCRYPTION_KEY: ${PAN_ENCRYPTION_KEY:?Set PAN_ENCRYPTION_KEY}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
